name: Build and Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch: # Cho phép nhấn nút "Run workflow" thủ công trên giao diện GitHub Actions

permissions:
  contents: write # Quyền tạo tag/Release và upload file .apk trực tiếp lên mục Releases

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Accept Android SDK Licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Prepare Debug Keystore
        run: |
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ] && tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore 2>/dev/null; then
              echo "Restored debug.keystore from debug.keystore.base64"
            else
              rm -f debug.keystore
              echo "Creating debug keystore..."
              keytool -genkey -noprompt -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Prepare Release Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from secrets..."
            printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > my-upload-key.jks
            echo "has_secret=true" >> "$GITHUB_OUTPUT"
          else
            echo "Creating CI release keystore..."
            rm -f my-upload-key.jks
            keytool -genkey -noprompt -v \
              -keystore my-upload-key.jks \
              -storepass android \
              -alias upload \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=VietLauncher,O=DevTruongThanh,C=VN"
            echo "has_secret=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure .env files exist
        run: |
          if [ ! -f ".env.example" ]; then
            echo "GEMINI_API_KEY=your_api_key_here" > .env.example
          fi
          if [ ! -f ".env" ]; then
            touch .env
          fi

      - name: Build Debug & Release APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ steps.keystore.outputs.has_secret == 'true' && secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ steps.keystore.outputs.has_secret == 'true' && secrets.KEY_PASSWORD || 'android' }}
          JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
        run: |
          gradle :app:assembleDebug --stacktrace
          gradle :app:assembleRelease --stacktrace

      - name: Prepare Versioned APK Outputs
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            VERSION="${GITHUB_REF_NAME#v}"
          else
            BASE_VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || true)
            BASE_VERSION="${BASE_VERSION:-1.0}"
            VERSION="${BASE_VERSION}.${GITHUB_RUN_NUMBER}"
            TAG_NAME="v${VERSION}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"

          mkdir -p release-apks
          cp app/build/outputs/apk/debug/app-debug.apk "release-apks/VietLauncher-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "release-apks/VietLauncher-v${VERSION}-release.apk"
          ls -lh release-apks/

      - name: Upload Release APK Artifact (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: VietLauncher-v${{ steps.version.outputs.version }}-release
          path: release-apks/VietLauncher-v${{ steps.version.outputs.version }}-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Debug APK Artifact (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: VietLauncher-debug-apk
          path: release-apks/VietLauncher-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release (.apk)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: VietLauncher v${{ steps.version.outputs.version }}
          make_latest: true
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-apks/VietLauncher-v${{ steps.version.outputs.version }}-release.apk
            release-apks/VietLauncher-debug.apk
