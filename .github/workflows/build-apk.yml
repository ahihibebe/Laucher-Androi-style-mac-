name: Build and Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch: # Cho phép nhấn nút "Run workflow" thủ công trên giao diện GitHub Actions

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    permissions:
      contents: write # Quyền tạo Release và upload APK lên mục Releases của GitHub

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Debug Keystore if missing
        run: |
          if [ ! -f "debug.keystore" ]; then
            echo "Creating debug keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Prepare Release Keystore if secrets not configured
        run: |
          if [ ! -f "my-upload-key.jks" ] && [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Creating CI release keystore..."
            keytool -genkey -v -keystore my-upload-key.jks -storepass android -alias upload -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=VietLauncher,O=DevTruongThanh,C=VN"
          elif [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
          fi

      - name: Create placeholder .env files
        run: |
          if [ ! -f ".env.example" ]; then
            echo "GEMINI_API_KEY=your_api_key_here" > .env.example
          fi
          if [ ! -f ".env" ]; then
            touch .env
          fi

      - name: Build Debug & Release APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: |
          gradle :app:assembleDebug :app:assembleRelease

      - name: Prepare Versioned APK Outputs
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            VERSION="1.0"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          mkdir -p release-apks
          cp app/build/outputs/apk/debug/app-debug.apk "release-apks/VietLauncher-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "release-apks/VietLauncher-v${VERSION}-release.apk"

      - name: Upload Release APK Artifact (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: VietLauncher-v${{ steps.version.outputs.version }}-release
          path: release-apks/VietLauncher-v${{ steps.version.outputs.version }}-release.apk
          retention-days: 14

      - name: Upload Debug APK Artifact (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: VietLauncher-debug-apk
          path: release-apks/VietLauncher-debug.apk
          retention-days: 14

      - name: Create GitHub Release (if tag is pushed)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-apks/VietLauncher-v${{ steps.version.outputs.version }}-release.apk
            release-apks/VietLauncher-debug.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
